name: Generate AI Blog Post

on:
  schedule:
    - cron: '50 2 * * *' # Runs every day at 2:50 AM UTC (7:50 AM Pakistan Time)
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run AI Blog Generator Script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python scripts/generate_blog.py

      - name: Commit and Push New Blog Post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git diff --quiet && git diff --staged --quiet || (git commit -m "content: auto-generate daily security blog post" && git push)
