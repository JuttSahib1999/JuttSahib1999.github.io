name: Generate AI Blog Post

on:

  # ============================================================
  # Daily automatic generation
  #
  # 02:50 UTC = 07:50 Pakistan Standard Time
  # ============================================================

  schedule:
    - cron: '50 2 * * *'

  # Manual generation remains available.
  workflow_dispatch:


# ==============================================================
# PERMISSIONS
# ==============================================================

permissions:
  contents: write


# ==============================================================
# CONCURRENCY
# ==============================================================

concurrency:
  group: generate-blog
  cancel-in-progress: false


# ==============================================================
# JOB
# ==============================================================

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai tenacity

      # --------------------------------------------------------
      # Generate blog
      # --------------------------------------------------------

      - name: Generate Daily AI Blog
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python scripts/generate_blog.py

      # --------------------------------------------------------
      # Check generated files
      # --------------------------------------------------------

      - name: Check Generated Content
        run: |
          echo "Generated blog files:"
          ls -lah src/content/blog/ | tail -10

          echo ""
          echo "Generated blog images:"
          ls -lah public/images/blog/ | tail -10

      # --------------------------------------------------------
      # Commit and push
      # --------------------------------------------------------

      - name: Commit and Push New Blog Post
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/content/blog/
          git add public/images/blog/

          if git diff --cached --quiet; then

            echo "No new blog content was generated."

          else

            git commit \
              -m "content: generate daily cybersecurity article"

            git push

          fi
